# EAP-DID wpa_supplicant configuration (did5 — self-contained peer)
#
# This config does NOT need a Holder Cloud Agent running.
# The VC and private key are loaded from files.

ctrl_interface=/var/run/wpa_supplicant
eapol_version=2
ap_scan=0
fast_reauth=1

network={
    key_mgmt=IEEE8021X
    eap=DID
    eapol_flags=0
    identity="user@inst.tld"
}
